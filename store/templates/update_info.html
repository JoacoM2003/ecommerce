{% extends 'base.html' %}
    
{% block content %}

<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder"> Create Profile
            </h1>
            <p class="lead fw-normal text-white-50 mb-0">Create your profile</p>
        </div>
    </div>
</header>
<main class="container py-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <form action="{% url 'update_info' %}", method="post" class="card card-body p-5">
                {% csrf_token %}
                
                <h1 class="text-center">Update</h1>

                <div class="card card-body">
                <strong>Billing Info</strong>
                {{ user_form.as_p }}
                </div>
                <br></br>
                <div class="card card-body">
                <strong>Shipping Info</strong>
                {{ shipping_form.as_p }}
                </div>

                <br>    

                <button type="submit" class="btn btn-primary">Update</button>
             </form>
        </div>
    </div>
</main>

{% endblock content %}
